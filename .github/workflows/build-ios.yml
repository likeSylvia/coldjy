name: Build iOS IPA (unsigned)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ColdTools/**"
      - "Scripts/**"
      - "project.yml"
      - ".github/workflows/build-ios.yml"

jobs:
  build:
    name: Build unsigned IPA on macOS
    runs-on: macos-15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      SCHEME: ColdTools
      PROJECT: ColdTools.xcodeproj
      IPA_NAME: ColdTools-unsigned.ipa

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # 优先选 SDK 预装好的 Xcode 版本 (macos-15 runner 上 16.2 最稳)
          # 跳过 16.3+, 它们的 iOS SDK 常常没预装需要下载
          CANDIDATES=(
            "/Applications/Xcode_16.2.app"
            "/Applications/Xcode_16.1.app"
            "/Applications/Xcode_16.app"
            "/Applications/Xcode.app"
          )
          for xc in "${CANDIDATES[@]}"; do
            if [ -d "$xc" ]; then
              # 检查 iOS SDK 是否真的装上了
              SDK_PATH="$xc/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs"
              if ls "$SDK_PATH"/iPhoneOS*.sdk 1>/dev/null 2>&1; then
                sudo xcode-select -s "$xc"
                echo "Selected: $xc"
                break
              else
                echo "Skipped (no iOS SDK): $xc"
              fi
            fi
          done
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos || true

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen &>/dev/null; then
            brew install xcodegen
          fi

      - name: Generate Xcode project
        run: |
          xcodegen generate
          echo "=== Generated project structure ==="
          ls -la ColdTools.xcodeproj/ || true

      - name: List schemes
        run: xcodebuild -project ColdTools.xcodeproj -list

      - name: Build archive (unsigned)
        run: |
          mkdir -p build
          set -o pipefail
          xcodebuild \
            -project "${{ env.PROJECT }}" \
            -scheme "${{ env.SCHEME }}" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$PWD/build/ColdTools.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            SKIP_INSTALL=NO \
            clean archive 2>&1 | tee build/build.log

      - name: Show errors if build failed
        if: failure()
        run: |
          echo "=== Compilation errors ==="
          grep -E "error:|warning:" build/build.log || true
          echo ""
          echo "=== Last 300 lines ==="
          tail -n 300 build/build.log

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build/build.log
          if-no-files-found: ignore

      - name: Package unsigned IPA
        run: |
          cd build
          mkdir -p Payload
          cp -R ColdTools.xcarchive/Products/Applications/ColdTools.app Payload/
          rm -rf Payload/ColdTools.app/_CodeSignature
          rm -rf Payload/ColdTools.app/embedded.mobileprovision
          zip -qr "${{ env.IPA_NAME }}" Payload
          ls -lh "${{ env.IPA_NAME }}"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ColdTools-unsigned-ipa
          path: build/${{ env.IPA_NAME }}
          retention-days: 30
          if-no-files-found: error

      - name: Create Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/${{ env.IPA_NAME }}
          draft: false
          prerelease: false
