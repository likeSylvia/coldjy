name: Build iOS IPA (unsigned)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ColdTools/**"
      - "Scripts/**"
      - "project.yml"
      - ".github/workflows/build-ios.yml"

jobs:
  build:
    name: Build unsigned IPA on macOS
    runs-on: macos-15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      SCHEME: ColdTools
      PROJECT: ColdTools.xcodeproj
      IPA_NAME: ColdTools-unsigned.ipa

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # macos-15 runner 默认带多个 Xcode, 选一个可用的 Xcode 16+
          if [ -d "/Applications/Xcode_16.3.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.3.app
          elif [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          elif [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen &>/dev/null; then
            brew install xcodegen
          fi

      - name: Verify AppIcon exists
        run: |
          ICON=ColdTools/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png
          if [ ! -f "$ICON" ]; then
            echo "ERROR: $ICON is missing from repo."
            exit 1
          fi
          ls -lh "$ICON"
          file "$ICON"

      - name: Generate Xcode project
        run: |
          xcodegen generate
          echo "=== Generated project structure ==="
          ls -la ColdTools.xcodeproj/ || true

      - name: List schemes
        run: xcodebuild -project ColdTools.xcodeproj -list

      - name: Build archive (unsigned)
        run: |
          mkdir -p build
          set -o pipefail
          xcodebuild \
            -project "${{ env.PROJECT }}" \
            -scheme "${{ env.SCHEME }}" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$PWD/build/ColdTools.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            clean archive 2>&1 | tee build/build.log

      - name: Show errors if build failed
        if: failure()
        run: |
          echo "=== Compilation errors ==="
          grep -E "error:|warning:" build/build.log || true
          echo ""
          echo "=== Last 300 lines ==="
          tail -n 300 build/build.log

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build/build.log
          if-no-files-found: ignore

      - name: Package unsigned IPA
        run: |
          cd build
          mkdir -p Payload
          cp -R ColdTools.xcarchive/Products/Applications/ColdTools.app Payload/
          rm -rf Payload/ColdTools.app/_CodeSignature
          rm -rf Payload/ColdTools.app/embedded.mobileprovision
          zip -qr "${{ env.IPA_NAME }}" Payload
          ls -lh "${{ env.IPA_NAME }}"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ColdTools-unsigned-ipa
          path: build/${{ env.IPA_NAME }}
          retention-days: 30
          if-no-files-found: error

      - name: Create Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/${{ env.IPA_NAME }}
          draft: false
          prerelease: false
