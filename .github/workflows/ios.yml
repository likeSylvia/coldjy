name: Build iOS IPA (unsigned)

on:
  # 手动触发
  workflow_dispatch:
  # 推送到 main 分支时自动触发
  push:
    branches: [main]
    paths:
      - "app.js"
      - "index.html"
      - "styles.css"
      - "sw.js"
      - "manifest.json"
      - "package.json"
      - "capacitor.config.json"
      - ".github/workflows/ios.yml"

jobs:
  build:
    name: Build unsigned IPA on macOS
    runs-on: macos-14

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install npm dependencies
        run: npm install

      - name: Prepare www directory
        run: |
          mkdir -p www
          cp index.html styles.css app.js manifest.json sw.js www/
          # 图标是可选的,没有也不会阻塞
          [ -f icon-192.png ] && cp icon-192.png www/ || echo "icon-192.png missing, skipping"
          [ -f icon-512.png ] && cp icon-512.png www/ || echo "icon-512.png missing, skipping"
          ls -la www/

      - name: Add iOS platform (if not exists)
        run: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Configure Info.plist (Face ID permission)
        run: |
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :NSFaceIDUsageDescription" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSFaceIDUsageDescription string '使用 Face ID 保护你的戒烟记录'" "$PLIST"
          # 允许本地通知
          /usr/libexec/PlistBuddy -c "Delete :NSUserNotificationUsageDescription" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSUserNotificationUsageDescription string '提醒你喝水和保持习惯'" "$PLIST"
          cat "$PLIST"

      - name: Install CocoaPods dependencies
        working-directory: ios/App
        run: pod install --repo-update

      - name: Build Xcode archive (unsigned)
        working-directory: ios/App
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$PWD/build/App.xcarchive" \
            -destination "generic/platform=iOS" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            archive

      - name: Package unsigned IPA
        working-directory: ios/App
        run: |
          cd build
          mkdir -p Payload
          cp -R App.xcarchive/Products/Applications/App.app Payload/
          # 移除可能存在的签名信息
          rm -rf Payload/App.app/_CodeSignature
          rm -rf Payload/App.app/embedded.mobileprovision
          zip -qr "tx-quit-smoking-unsigned.ipa" Payload
          ls -lh tx-quit-smoking-unsigned.ipa

      - name: Upload IPA as artifact
        uses: actions/upload-artifact@v4
        with:
          name: tx-quit-smoking-unsigned-ipa
          path: ios/App/build/tx-quit-smoking-unsigned.ipa
          retention-days: 30
          if-no-files-found: error

      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ios/App/build/tx-quit-smoking-unsigned.ipa
          draft: false
          prerelease: false
